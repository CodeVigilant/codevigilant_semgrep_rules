rules:
  - id: codevigilant.java.jenkins.ssrf.urlconnection-auth
    patterns:
      - pattern: $CONN.setRequestProperty("Authorization", $AUTH);
      - pattern-inside: |
          $CONN = $URL.openConnection();
          ...
      - pattern-not-inside: |
          $CONN = new URL("...").openConnection();
          ...
    message: |
      Detected an outbound HTTP request whose Authorization header is attached
      to a connection opened from a non-literal URL. When the URL is derived
      from configuration, build parameters or other user-influenced input, the
      configured credentials are forwarded to attacker-chosen hosts (credential
      disclosure) and internal services can be reached from the Jenkins
      controller (SSRF). Validate the URL at runtime before attaching
      credentials: restrict the scheme to http/https and check the host
      against the configured remote server.
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    mode: search
    severity: HIGH
