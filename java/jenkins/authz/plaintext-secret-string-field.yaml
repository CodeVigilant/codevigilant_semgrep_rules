rules:
  - id: codevigilant.java.jenkins.authz.plaintext-secret-string-field
    languages: [java]
    mode: search
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: private String $FIELD;
          - pattern: public String $FIELD;
          - pattern: String $FIELD;
          - pattern: $GENERIC<String> $FIELD;
      - metavariable-regex:
          metavariable: $FIELD
          regex: (?i).*(token|password|passwd|passphrase|secret|clientsecret|accesskey|api.?key|private.?key|authkey|certdata|jwt).*
      - pattern-not: private transient String $FIELD;
      - pattern-not: public transient String $FIELD;
      - pattern-not: transient String $FIELD;
      - pattern-not: private static final String $FIELD;
      - pattern-not: public static final String $FIELD;
      - pattern-not: static final String $FIELD;
      - pattern-not: private final String $FIELD;
      - pattern-not: public final String $FIELD;
      - pattern-not: final String $FIELD;
      - pattern-not: private String $FIELD = "...";
      - pattern-not: public String $FIELD = "...";
      - pattern-not: String $FIELD = "...";
    message: |
      A Jenkins plugin class stores a secret-looking value (detected via the
      field name: $FIELD) in a plain `java.lang.String` field rather than
      `hudson.util.Secret` (or a Secret-backed credential store). Jenkins
      persists `String` fields of global/folder/job configuration and
      deserializable credential objects verbatim into `config.xml` / credential
      XML on disk in cleartext, and Stapler echoes the getter value back to the
      configuration page. This also leaves the value readable from disk backups,
      from any user with read access to the configuration file, and from the
      config UI. Jenkins Step and Describable classes commonly expose
      `@DataBoundConstructor`/`@DataBoundSetter` fields as `public`; such fields
      are (de)serialized into the job `config.xml` exactly as declared, so a
      secret stored there is persisted in cleartext. Use `hudson.util.Secret`
      (Secret.fromString / Secret.toString) for any value that represents a
      credential, service-account token, password, API key or private key so
      that Jenkins encrypts it at rest and masks it in the UI. The same applies
      when the secret is carried inside a generic container whose type argument
      is `String` (e.g. `Supplier<String>`, a snapshot/holder class parameterised
      with `String`): the element type defeats the encryption just as directly as
      a bare `String` field, so carry the container over `hudson.util.Secret` /
      `SecretBytes` instead.
    metadata:
      category: security
      cwe: "CWE-256: Unprotected Storage of Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
        - https://javadoc.jenkins.io/hudson/util/Secret.html
      source: independent security review
      license: MIT