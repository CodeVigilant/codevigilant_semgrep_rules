rules:
  - id: codevigilant.java.jenkins.authz.credentialsstore-system-acl
    languages: [java]
    mode: search
    severity: HIGH
    patterns:
      - pattern-inside: |
          class $STORE extends CredentialsStore {
            ...
          }
      - pattern-either:
          - pattern: Jenkins.getInstance().getACL().hasPermission($AUTH, $PERM)
          - pattern: Jenkins.getInstance().hasPermission($PERM)
          - pattern: Jenkins.getInstance().getACL().hasPermission($AUTH, $PERM);
          - pattern: $OWNER.$METHOD($TYPE, $CTX, ACL.SYSTEM)
    message: |
      A CredentialsStore subclass authorizes credential access using the
      top-level Jenkins ACL (`Jenkins.getInstance().getACL()` /
      `Jenkins.getInstance().hasPermission(...)`) and/or retrieves credential
      data under a hardcoded `ACL.SYSTEM` authentication instead of honoring
      the owning ItemGroup/folder ACL and the caller's Authentication. The
      store's permission surface is therefore enforced against the global ACL
      alone, independent of the item/folder the store was created for, and the
      underlying data-access method is force-satisfied with SYSTEM privileges
      even when the caller holds only the checked global permission (e.g.
      Credentials VIEW). A principal with the granted global permission can
      enumerate and obtain credential objects (usernames, passwords, tokens)
      that belong to another item scope, bypassing folder-level and
      per-credential authorization. Consult the owner's ACL
      (`((ACLContext) getContext()).getACL()`) and pass the caller's
      Authentication, not `ACL.SYSTEM`, for every data-retrieval path.
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 - Broken Access Control"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
      source: independent security review
      license: MIT