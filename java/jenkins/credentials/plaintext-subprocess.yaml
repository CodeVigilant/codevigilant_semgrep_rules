rules:
  - id: codevigilant.java.jenkins.credentials.plaintext-subprocess
    mode: taint
    pattern-sources:
      - pattern: $CRED.getPassword()
      - pattern: $CRED.getSecret()
      - pattern: $CRED.getPlainText()
      - pattern: $CRED.getSecretValue()
      - pattern: $CRED.getToken()
      - pattern: $CRED.getApiKey()
      # explicit de-masking of a Jenkins Secret into plaintext
      - pattern: Secret.toString($S)
      # credential-ish getters on arbitrary objects (descriptor/model getters
      # returning Secret-typed fields), e.g. getXxxPassword()/getXxxSecret()
      - patterns:
          - pattern: $CALL()
          - metavariable-regex:
              metavariable: $CALL
              regex: (?i).*(get|return).*(pass|secret|token|apikey|api_key).*
    pattern-sinks:
      - pattern: Runtime.exec($ARG)
      - pattern: |
          new ProcessBuilder($ARGS)
      - pattern: |
          $CMD.add($ARG)
      - pattern: |
          $CMD.addMasked($ARG)
      - patterns:
          - pattern: $VARS.put($NAME, $VALUE)
          - metavariable-regex:
              metavariable: $VARS
              regex: (?i).*(env).*
      - patterns:
          - pattern: $VARS.putAll($MAP)
          - metavariable-regex:
              metavariable: $VARS
              regex: (?i).*(env).*
    message: |
      Detected a credential value (password/secret/token retrieved from a
      credential store or a model object getter) flowing into a child-process
      command-line argument or environment map. Process arguments are visible
      in the OS process table (e.g. /proc/<pid>/cmdline on Linux, Task Manager
      on Windows) to any local user of the node; environment variables are
      inherited by every child process and visible to other processes running
      under the same OS user (e.g. via 'ps eww' on Linux). Log masking does not
      help: the secret still travels in the argument vector or environment, and
      may be captured by process dumps/build wrappers. Pass secrets only
      through a permission-protected temporary file, stdin, or Jenkins'
      secret-handling mechanisms (credentials bindings with masking), and never
      store them in plaintext model fields.
    metadata:
      category: security
      cwe: "CWE-214: Exposure of Sensitive Information Due to Incompatible Policies"
      owasp: "A01:2021 - Broken Access Control"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/Command_Line_Injection
        - https://www.jenkins.io/doc/developer/security/
        - https://www.jenkins.io/doc/developer/security/secrets/
      source: independent security review
      license: MIT
    languages: [java]
    severity: HIGH