rules:
  - id: codevigilant.java.jenkins.credentials.secret-getter-plaintext
    mode: search
    severity: HIGH
    message: >-
      A getter returns a Jenkins Secret credential as plaintext via
      hudson.util.Secret.getPlainText() or Secret.toString() (which decrypts).
      Returning plaintext from a data-bound getter defeats hudson.util.Secret
      masking: the value is placed into the rendered configuration page source,
      replayed in every config form submission, and exposed through Stapler
      property binding. Have the getter return the hudson.util.Secret object
      itself (not its plaintext) so Jenkins masks it, or keep the value in the
      credentials store.
    languages:
      - java
    patterns:
      - pattern-either:
          - pattern-inside: |
              public String $GETTER(...) {
                ...
              }
          - pattern-inside: |
              String $GETTER(...) {
                ...
              }
      - pattern-either:
          - pattern: return $RECEIVER.getPlainText();
          - patterns:
              - pattern: return $RECEIVER.toString();
              - metavariable-regex:
                  metavariable: $RECEIVER
                  regex: (?i).*(password|passwd|secret|token|key|pw|credential).*
      - metavariable-regex:
          metavariable: $GETTER
          regex: ^get[A-Z0-9_].*
    metadata:
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
        - "CWE-200: Exposure of Sensitive Information"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      technology:
        - jenkins
        - java
      confidence: HIGH
      category: security
      references:
        - https://javadoc.jenkins.io/hudson/util/Secret.html
        - https://www.jenkins.io/doc/developer/security/secrets/
      source:
        - private static rule
      license: MIT
