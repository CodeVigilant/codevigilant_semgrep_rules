rules:
  - id: codevigilant.java.jenkins.credentials.plaintext-secret-field
    patterns:
      - pattern-inside: |
          class $C extends $PARENT {
            ...
          }
      - pattern-either:
          - pattern: private String $FIELD;
          - pattern: protected String $FIELD;
          - pattern: public String $FIELD;
          - pattern: String $FIELD;
      - metavariable-regex:
          metavariable: $FIELD
          regex: (?i).*(password|passwd|secret|apikey|api_key|auth_token|access_token|token).*
      - metavariable-regex:
          metavariable: $PARENT
          regex: (?i).*(scm|toolinstallation|describable|step|builder|recorder|publisher|wrapper|trigger|notifier).*
    message: |
      Detected a plain String-typed field whose name indicates a secret
      (password/secret/token) declared in a Jenkins extension model class
      (SCM, ToolInstallation, Describable, Step, ...). Jenkins model
      objects are persisted to XML (job or global configuration) and their
      getters are exposed through Stapler property binding, so a plaintext
      secret field can be read from the config file on disk and, via an
      unguarded getter, through web property URLs. Store secrets in the
      credentials store or wrap them in hudson.util.Secret, mark the field
      transient, and avoid public getters that return the raw secret.
    metadata:
      category: security
      cwe: "CWE-256: Unprotected Storage of Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    mode: search
    severity: HIGH
