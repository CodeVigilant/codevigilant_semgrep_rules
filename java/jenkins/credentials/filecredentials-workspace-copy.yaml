rules:
  - id: codevigilant.java.jenkins.credentials.filecredentials-workspace-copy
    patterns:
      - pattern-inside: |
          $FP = $WS.createTempFile(...);
          ...
      - pattern: $FP.copyFrom($FC.getContent())
    message: |
      Detected secret file-credential content (FileCredentials) being
      copied to a temporary file created in a workspace/node path and not
      deleted afterwards. Secret material left on disk in the workspace is
      readable by other local users and jobs sharing the node and can be
      swept into workspace archives or captured by backups. Delete the
      temporary file in a finally block after the child process finishes,
      or avoid materializing the credential on disk entirely.
    metadata:
      category: security
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    mode: search
    severity: HIGH
