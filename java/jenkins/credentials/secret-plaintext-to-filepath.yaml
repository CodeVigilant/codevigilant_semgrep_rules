rules:
  - id: codevigilant.java.jenkins.credentials.secret-plaintext-to-filepath
    mode: taint
    languages:
      - java
    severity: HIGH
    message: >-
      A Jenkins Secret-derived plaintext value (hudson.util.Secret.toString(),
      a credential getter's getPlainText()/getSecret().getPlainText(), or the
      material unwrapped from a Secret typed field) is written into a FilePath
      data/temp file via createTextTempFile(...). On agents the target FilePath
      is typically the job workspace, so the secret material is persisted in
      cleartext on the node where any sibling build step or local OS user can
      read it, and can be swept into workspace archives, backups or shared
      storage. Keep the Secret in the credentials store and never materialize
      its plaintext to a workspace FilePath; if a temp file is unavoidable,
      write it to a permission-restricted directory under Jenkins' control and
      delete it in a finally block.
    metadata:
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
        - "CWE-200: Exposure of Sensitive Information"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      technology:
        - jenkins
        - java
      confidence: HIGH
      category: security
      references:
        - https://javadoc.jenkins.io/hudson/util/Secret.html
        - https://www.jenkins.io/doc/developer/security/secrets/
      source:
        - priv/getPlainText()/Secret.toString() into FilePath.createTextTempFile
      license: MIT
    pattern-sources:
      - pattern: Secret.toString($ANY)
      - pattern: $CRED.getPlainText()
      - pattern: $CRED.getSecret().getPlainText()
    pattern-sinks:
      - pattern: $FP.createTextTempFile($PREFIX, $SUFFIX, $CONTENT, $IN_WS)