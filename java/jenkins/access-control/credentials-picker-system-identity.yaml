rules:
  # ============================================================================
  # CREDENTIAL PICKER POPULATED WITH THE SYSTEM IDENTITY
  # (CWE-863 Incorrect Authorization / CWE-639 Authorization Bypass Through
  #  User-Controlled Key / CWE-200 Exposure of Sensitive Information)
  #
  # Generic shape: the list box that fills a credential drop-down is populated
  # through `includeAs(<identity>, <item>, <credential type>)` (or
  # `includeMatchingAs(...)`) with a hard-coded SYSTEM identity (`ACL.SYSTEM` /
  # `ACL.SYSTEM2`) instead of the requesting user's authentication.
  #
  # The credentials API evaluates the supplied identity's ACL to decide which
  # credentials to return, so SYSTEM returns everything reachable from the item's
  # scope (all global credentials plus folder-scope credentials on the item's
  # ancestry). That list is rendered into the configuration form, so the id and
  # display name of every credential - display names normally identify the
  # account, tenant or subscription the secret administers - reach any caller who
  # can open the form, regardless of the per-user credential grants the operator
  # configured. The ids are also what callers feed back into `credentialsId`
  # fields, so the disclosure hands out usable identifiers.
  #
  # Sanitizer exclusion: global (system) configuration pages legitimately pass
  # the root `Jenkins` instance as the credential context and are reached only by
  # administrators; those calls are not reported. A page-level
  # `hasPermission(...)` guard on a *job* context is NOT treated as a sanitizer -
  # it narrows the audience but still lists credentials the caller may not use,
  # so it stays in scope for review.
  # ============================================================================
  - id: codevigilant.java.jenkins.access-control.credentials-picker.system-identity
    languages:
      - java
    message: >-
      Credential picker is populated with a hard-coded SYSTEM identity
      (`ACL.SYSTEM` / `ACL.SYSTEM2`) instead of the requesting user's
      authentication. The credentials API applies the supplied identity's ACL, so
      the list box returns every credential in the item's scope to whoever can
      reach the form, bypassing the per-user credential grants the operator set.
      Pass the current request's authentication (for example
      `Jenkins.getAuthentication2()`) so the picker is filtered by what the
      caller is allowed to use.
    severity: HIGH
    metadata:
      cwe:
        - "CWE-863: Incorrect Authorization"
        - "CWE-639: Authorization Bypass Through User-Controlled Key"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp:
        - "A01:2021 - Broken Access Control"
      technology:
        - "java"
        - "jenkins"
      confidence: MEDIUM
      references:
        - "https://github.com/jenkinsci/credentials-plugin/blob/master/src/main/java/com/cloudbees/plugins/credentials/common/AbstractIdCredentialsListBoxModel.java"
        - "https://cwe.mitre.org/data/definitions/863.html"
        - "https://cwe.mitre.org/data/definitions/639.html"
      source: "CodeVigilant code review guidance: credential listing evaluated under the system identity"
      license: "Semgrep Rules License v1.0"
    patterns:
      - pattern-either:
          - pattern: $MODEL.includeAs(ACL.SYSTEM, ...)
          - pattern: $MODEL.includeAs(hudson.security.ACL.SYSTEM, ...)
          - pattern: $MODEL.includeAs(ACL.SYSTEM2, ...)
          - pattern: $MODEL.includeAs(hudson.security.ACL.SYSTEM2, ...)
          - pattern: $MODEL.includeMatchingAs(ACL.SYSTEM, ...)
          - pattern: $MODEL.includeMatchingAs(hudson.security.ACL.SYSTEM, ...)
          - pattern: $MODEL.includeMatchingAs(ACL.SYSTEM2, ...)
          - pattern: $MODEL.includeMatchingAs(hudson.security.ACL.SYSTEM2, ...)
      # global/system configuration pages (root Jenkins as the context) are
      # administrator-only - not reported
      - pattern-not: $MODEL.includeAs(ACL.SYSTEM, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeAs(hudson.security.ACL.SYSTEM, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeAs(ACL.SYSTEM2, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeAs(hudson.security.ACL.SYSTEM2, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeMatchingAs(ACL.SYSTEM, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeMatchingAs(hudson.security.ACL.SYSTEM, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeMatchingAs(ACL.SYSTEM2, Jenkins.get(), ...)
      - pattern-not: $MODEL.includeMatchingAs(hudson.security.ACL.SYSTEM2, Jenkins.get(), ...)
