rules:
  # ============================================================================
  # RUNTIME SECRET WRITTEN AS A TEMPLATE PARAMETER `defaultValue`
  # (CWE-312 Cleartext Storage of Sensitive Information / CWE-522)
  # Generic shape: a value obtained from a credential/key/password API (e.g.
  # `creds.getPassword().getPlainText()`, `keys.get(0).value()`,
  # `Secret.toString(...)`) is placed into a structured deployment template as
  # `put("defaultValue", <secret>)`. Default values are part of the template
  # DOCUMENT, and infrastructure providers persist that document with the
  # deployment (deployment history, portal template view, management REST API),
  # so any principal with read access to the deployment or its resource group
  # can retrieve the secret even though the parameter is declared with a
  # protected type such as `secureString`. Only values supplied separately in
  # the parameters payload (or `protectedSettings`) are withheld.
  # ============================================================================
  - id: codevigilant.java.jenkins.secrets.template-parameter-default-value
    languages:
      - java
    message: >-
      A secret obtained from a credential, key or password API is written as the
      `defaultValue` of a deployment/template parameter. Default values are part
      of the template document, and deployment services persist that document
      with the deployment (history, portal "template" view, REST API), where any
      principal holding read access to the deployment or its resource group can
      retrieve it. Pass secrets as protected parameter values (for example a
      `secureString` value supplied in the parameters payload, or a
      `protectedSettings` block) instead of baking them into the template.
    severity: ERROR
    metadata:
      cwe:
        - "CWE-312: Cleartext Storage of Sensitive Information"
        - "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A05:2021 - Security Misconfiguration"
      technology:
        - "java"
        - "azure-resource-manager"
      confidence: MEDIUM
      references:
        - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/parameter-files"
        - "https://cwe.mitre.org/data/definitions/312.html"
      source: "CodeVigilant code review guidance: secrets in template default values"
      license: Semgrep Rules License v1.0
    patterns:
      - pattern-either:
          # secret resolved into a local, then stored as a template default value
          - patterns:
              - pattern-inside: |
                  $SECRET = $SRC;
                  ...
              - pattern: $NODE.put("defaultValue", $SECRET)
              - metavariable-pattern:
                  metavariable: $SRC
                  language: generic
                  patterns:
                    - pattern-either:
                        - pattern: $CRED.getPlainText()
                        - pattern: $CRED.getPassword().getPlainText()
                        - pattern: $CRED.getPassword()
                        - pattern: $KEYLIST.get(...).value()
                        - pattern: $KEYLIST.get(...)
                        - pattern: Secret.toString(...)
                        - pattern: $CRED.getSecret()
                        - pattern: $CRED.getPrivateKey(...)
          # secret accessor inlined directly into the default value
          - pattern-either:
              - pattern: $NODE.put("defaultValue", $CRED.getPlainText())
              - pattern: $NODE.put("defaultValue", $CRED.getPassword().getPlainText())
              - pattern: $NODE.put("defaultValue", $CRED.getPassword())
              - pattern: $NODE.put("defaultValue", $KEYLIST.get(...).value())
              - pattern: $NODE.put("defaultValue", Secret.toString(...))
              - pattern: $NODE.set("defaultValue", $CRED.getPlainText())
              - pattern: $NODE.set("defaultValue", $KEYLIST.get(...).value())
