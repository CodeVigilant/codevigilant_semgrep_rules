rules:
  - id: codevigilant.java.jenkins.secrets.hardcoded-credential-literal
    languages: [java]
    mode: search
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              $X = "...";
          - pattern: |
              String $X = "...";
          - pattern: |
              static final String $X = "...";
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(token|secret|password|apikey|api_key|passwd|credential|auth|access_key).*
    message: |
      A credential/secret value appears to be assigned as a hardcoded string
      literal to an identifier whose name implies a secret or token
      (`$X`). Credentials embedded as literals in committed source or build
      scripts are effectively public once the repository is shared, and any
      secret declared this way cannot be rotated or scoped per environment.
      Use a secure secret store / injected environment (e.g. Jenkins
      credentials binding, a vault, or a masked credential provider) instead
      of a literal, and never commit secret values.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
      source: independent security review
      license: MIT