rules:
  - id: codevigilant.java.jenkins.secrets.credential-global-scope
    mode: search
    patterns:
      - pattern-either:
          - pattern: new $CRED(CredentialsScope.GLOBAL, $ARG2, ...);
          - pattern: new $CRED(CredentialsScope.GLOBAL, $ARGS);
      - metavariable-regex:
          metavariable: $CRED
          regex: (UsernamePasswordCredentialsImpl|BasicSSHUserPrivateKey|StringCredentialsImpl|FileCredentialsImpl|OAuth2Credentials|OpenSSHCredentials|UsernamePasswordCredentials|SecretBytesCredentials|DockerServerCredentials|StandardUsernamePasswordCredentials)
    message: |
      A Jenkins credentials object is constructed with a hardcoded
      CredentialsScope.GLOBAL scope. GLOBAL-scope credentials are visible to and
      usable by every user and job in the Jenkins instance (and in many setups they
      are also exported to agents), so forcing newly-created credentials into this
      scope on construction can broaden exposure of a secret beyond its intended
      owner, folder or namespace — including secrets originally scoped to a specific
      project or cluster namespace. Prefer CredentialsScope.SYSTEM (or a
      project/folder-scoped scope) and derive scope from the credential's origin
      rather than hardcoding GLOBAL (CWE-269 / CWE-200). Note: this rule flags the
      code shape only; a false positive may be a deliberate global-scope decision.
    metadata:
      category: security
      cwe: "CWE-269: Improper Privilege Management"
      owasp: "A01:2021 - Broken Access Control"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/269.html
        - https://cwe.mitre.org/data/definitions/200.html
        - https://www.jenkins.io/doc/developer/extensions/credentials/
      source: independent security review
      license: MIT
    languages: [java]
    severity: MEDIUM