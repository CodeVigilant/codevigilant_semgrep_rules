rules:
  # ============================================================================
  # DECRYPTED SECRET FROM A SECRETS/PARAMETER API WRITTEN INTO THE BUILD
  # ENVIRONMENT UNMASKED (CWE-532 Log Exposure / CWE-522 Insufficiently
  # Protected Credentials)
  # Generic shape: a value returned by a secrets / parameter-store getter with
  # decryption enabled (`$CLIENT.getParameter($REQ).getParameter().getValue()`,
  # `$CLIENT.getSecretValue($REQ).getSecretString()`,
  # `$CLIENT.getSecretString()`) is passed straight into the build environment
  # through `SimpleBuildWrapper.Context.env($KEY, $VALUE)` as a plain String.
  # Jenkins does not mask plain environment values -- masking requires a
  # Secret-backed value or a masking ConsoleLogFilter -- so the decrypted
  # secret is emitted verbatim into the build console as soon as the build
  # prints its environment (`env`, `printenv`, `set -x`, echoed config), where
  # anyone with read access to the build log can recover it. Wrap the value in
  # `hudson.util.Secret`, register the variable name via
  # `makeSensitiveBuildVariables`, or install a masking ConsoleLogFilter.
  # ============================================================================

  - id: codevigilant.java.jenkins.secrets.decrypted-secret-into-build-env
    message: >-
      A decrypted secret returned by a secrets / parameter-store getter is
      written into the build environment through
      `SimpleBuildWrapper.Context.env(...)` as a plain String. Jenkins does not
      mask plain environment values (masking needs a Secret-backed value or a
      masking ConsoleLogFilter), so the secret is printed verbatim in the build
      console whenever the build dumps its environment, exposing it to anyone
      who can read the build log (CWE-532/CWE-522). Wrap the value in
      `hudson.util.Secret`, register the variable name via
      `makeSensitiveBuildVariables`, or install a masking ConsoleLogFilter
      before injecting it into the environment.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern: $CTX.env($KEY, $VALUE)
      - metavariable-pattern:
          metavariable: $VALUE
          patterns:
            - pattern-either:
                - pattern: $CLIENT.getParameter($REQ).getParameter().getValue()
                - pattern: $CLIENT.getSecretValue($REQ).getSecretString()
                - pattern: $CLIENT.getSecretString()
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
        - https://javadoc.jenkins.io/jenkins/tasks/SimpleBuildWrapper.Context.html
        - https://cwe.mitre.org/data/definitions/532.html
      source: semgrep-rule-gap
      license: MIT
