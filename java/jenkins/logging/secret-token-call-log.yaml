rules:
  # ============================================================================
  # SECRET/TOKEN-ACQUIRING METHOD RESULT PASSED DIRECTLY TO A LOGGER
  # Generic shape: a java.util.logging / jenkins Logger call receives, as its
  # message or a message argument, the return value of a method whose name
  # indicates it yields a secret (token / secret / password / key / credential /
  # authorization / bearer). Such values are live credentials or bearer tokens;
  # writing them to the server log exposes them at rest, where operators and
  # log-collection/aggregation systems can read them, and can lead to
  # credential disclosure (CWE-532). Only redacted/sanitized indicators should
  # be logged (e.g. whether a credential was resolved), never the secret itself.
  # ============================================================================

  - id: codevigilant.java.jenkins.logging.secret-token-call-log
    message: >-
      A logger call receives, as part of its message, the return value of a
      secret/token-acquiring method (name matching token/secret/password/key/
      credential/authorization/bearer). These values are live credentials or
      bearer tokens; writing them to the log exposes them at rest to operators
      and log-shipping systems and can lead to credential disclosure (CWE-532).
      Log only redacted or sanitized fields, never the secret value itself.
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: $LOG.$LEVEL("$PREFIX" + $OBJ.$CALL(...))
          - pattern: $LOG.$LEVEL($FMT, $OBJ.$CALL(...))
          - pattern: $LOG.$LEVEL($OBJ.$CALL(...))
          - pattern: $LOG.$LEVEL("$PREFIX" + $OBJ.$CALL(...) + $REST)
      - metavariable-regex:
          metavariable: $CALL
          regex: (?i).*(token|secret|password|apikey|api_key|private|bearer|credential|authorization).*
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
      source: semgrep-rule-gap
      license: MIT