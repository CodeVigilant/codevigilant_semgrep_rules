rules:
  # ============================================================================
  # HARDCODED CREDENTIAL / API KEY IN CLASS PROPERTY
  # Generic CodeVigilant rule.
  # ============================================================================
  #
  # Flags class properties whose name suggests a credential (api_key,
  # secret, token, apikey, auth key ...) and whose default value is a
  # non-empty string literal. A key shipped inside plugin/theme source is
  # identical on every install, is extracted trivially from the distributed
  # package, and cannot be rotated per site. If the backend authenticates
  # requests with that key alone, any install can impersonate the client or
  # forge privileged calls (CWE-798: Use of Hard-coded Credentials).
  #
  # Placeholder-looking values ('', 'CHANGE_ME', 'your-key-here', etc.) are
  # excluded via pattern-not so the rule stays quiet on scaffolded code.

  - id: codevigilant.php.wordpress.secrets.hardcoded_api_key_property
    severity: HIGH
    languages: [php]
    mode: search
    patterns:
      - pattern: |
          $KEY = $VALUE;
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api[_]?key|apikey|secret|secret[_]?key|auth[_]?token|access[_]?token|refresh[_]?token|client[_]?secret|passw(or)?d|passwd).*
      - metavariable-pattern:
          metavariable: $VALUE
          patterns:
            - pattern: |
                "..."
            - pattern-not: |
                ""
            - pattern-not-regex: (?i)^\s*['"](change[_-]?me|your[_-]?.*(key|secret|token)|xxx+|todo|placeholder|example)[^'"]*['"]\s*$
    message: |
      A class property whose name indicates a credential (api key, secret,
      token, password) is initialized with a hard-coded string literal. The
      same value ships with every install and can be extracted from the
      distributed source, so it cannot be treated as a secret. Move it to a
      per-site configuration (wp_options, environment variable, filtered
      constant) and rotate any value already shipped in releases.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
        - https://developer.wordpress.org/plugins/security/securing-input/
      source: CodeVigilant
      license: MIT
