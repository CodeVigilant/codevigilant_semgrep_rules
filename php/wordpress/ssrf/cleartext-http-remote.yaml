rules:
  # ============================================================================
  # CLEARTEXT HTTP REMOTE REQUESTS
  # Generic shape: wp_remote_*() invoked with an http:// URL. Data sent to
  # third-party or internal endpoints over plain HTTP can be intercepted or
  # tampered with in transit (CWE-319).
  # ============================================================================
  - id: codevigilant.php.wordpress.ssrf.cleartext_http_remote.direct
    patterns:
      - pattern-either:
          - pattern: |
              wp_remote_get(<... $URL ...>);
          - pattern: |
              wp_remote_post(<... $URL ...>);
          - pattern: |
              wp_remote_request(<... $URL ...>);
      - metavariable-pattern:
          metavariable: $URL
          pattern-regex: "http://"
    message: |
      Detected a cleartext HTTP remote request in WordPress.
      wp_remote_*() is called with an http:// URL. Data exchanged with
      third-party or internal endpoints over plain HTTP can be intercepted
      or tampered with in transit. Use https:// URLs for all remote requests.
    metadata:
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: wordpress
      confidence: HIGH
      references:
        - https://developer.wordpress.org/apis/security/securing-requests/
    languages: [php]
    mode: search
    severity: MEDIUM
