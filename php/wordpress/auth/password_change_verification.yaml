rules:
  # ============================================================================
  # UNVERIFIED PASSWORD CHANGE (CWE-620)
  #
  # A request handler writes a new password for a user without first proving the
  # caller is allowed to do so. Two shapes share the same sink:
  #
  #   1. Self-service change: the new password (and often the target user id)
  #      comes straight from request data, and the current password is never
  #      re-verified. Anyone who can reach the endpoint can set an arbitrary
  #      account's password — including handlers registered with
  #      permission_callback => '__return_true'.
  #
  #   2. Reset flow: the reset key / nonce is never consumed before the write,
  #      so the password can be planted without holding a valid token.
  #
  # Sinks: wp_set_password(), update_user_meta/update_user_option('user_pass'),
  #        wp_update_user(array('user_pass' => ...)).
  # Sources: $_POST / $_GET / $_REQUEST, WP_REST_Request::get_param(s)/
  #        get_json_params/get_body_params.
  #
  # A verification call earlier in the same block suppresses the finding:
  # wp_check_password(), check_password_reset_key(), wp_verify_nonce(),
  # check_admin_referer(), check_ajax_referer(), current_user_can(),
  # is_super_admin(). That deliberately trades a little precision — a handler
  # that calls wp_check_password() but ignores the boolean will not be reported —
  # for zero false positives on the ordinary, correctly written change-password
  # and lost-password handlers.
  # ============================================================================

  - id: codevigilant.php.wordpress.auth.password_change.missing_verification
    message: >-
      Password is written from request data without verifying the caller: no
      wp_check_password() of the current password, no check_password_reset_key()
      / nonce token check and no current_user_can() capability check precedes
      the write. Verify the current password or the reset token first, then
      call wp_set_password().
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-inside: |
          function $FUNC(...) {
            ...
          }
      - pattern-either:
          # --- wp_set_password() ------------------------------------------
          - pattern: |
              $PW = $_POST[$KEY];
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              $PW = $_GET[$KEY];
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              $PW = $_REQUEST[$KEY];
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              $PW = $REQUEST->get_param(...);
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              $PW = $REQUEST->get_params(...);
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              $PW = $REQUEST->get_json_params(...);
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              $PW = $REQUEST->get_body_params(...);
              ...
              wp_set_password($PW, $USER_ID);
          - pattern: |
              wp_set_password($_POST[$KEY], $USER_ID);
          - pattern: |
              wp_set_password($_GET[$KEY], $USER_ID);
          - pattern: |
              wp_set_password($_REQUEST[$KEY], $USER_ID);
          - pattern: |
              wp_set_password($REQUEST->get_param(...), $USER_ID);
          - pattern: |
              wp_set_password($REQUEST->get_params(...), $USER_ID);
          - pattern: |
              wp_set_password($REQUEST->get_json_params(...), $USER_ID);
          - pattern: |
              wp_set_password($REQUEST->get_body_params(...), $USER_ID);
          # --- update_user_meta() -----------------------------------------
          - pattern: |
              $PW = $_POST[$KEY];
              ...
              update_user_meta($USER_ID, 'user_pass', $PW);
          - pattern: |
              $PW = $_GET[$KEY];
              ...
              update_user_meta($USER_ID, 'user_pass', $PW);
          - pattern: |
              $PW = $_REQUEST[$KEY];
              ...
              update_user_meta($USER_ID, 'user_pass', $PW);
          - pattern: |
              $PW = $REQUEST->get_param(...);
              ...
              update_user_meta($USER_ID, 'user_pass', $PW);
          - pattern: |
              $PW = $REQUEST->get_params(...);
              ...
              update_user_meta($USER_ID, 'user_pass', $PW);
          - pattern: |
              $PW = $REQUEST->get_json_params(...);
              ...
              update_user_meta($USER_ID, 'user_pass', $PW);
          - pattern: |
              update_user_meta($USER_ID, 'user_pass', $_POST[$KEY]);
          - pattern: |
              update_user_meta($USER_ID, 'user_pass', $_GET[$KEY]);
          - pattern: |
              update_user_meta($USER_ID, 'user_pass', $_REQUEST[$KEY]);
          - pattern: |
              update_user_meta($USER_ID, 'user_pass', $REQUEST->get_param(...));
          - pattern: |
              update_user_meta($USER_ID, 'user_pass', $REQUEST->get_params(...));
          - pattern: |
              update_user_meta($USER_ID, 'user_pass', $REQUEST->get_json_params(...));
          # --- update_user_option() ---------------------------------------
          - pattern: |
              $PW = $_POST[$KEY];
              ...
              update_user_option($USER_ID, 'user_pass', $PW);
          - pattern: |
              $PW = $_REQUEST[$KEY];
              ...
              update_user_option($USER_ID, 'user_pass', $PW);
          - pattern: |
              update_user_option($USER_ID, 'user_pass', $_POST[$KEY]);
          - pattern: |
              update_user_option($USER_ID, 'user_pass', $_REQUEST[$KEY]);
          # --- wp_update_user() with a user_pass key ----------------------
          - pattern: |
              $PW = $_POST[$KEY];
              ...
              wp_update_user(array(..., 'user_pass' => $PW, ...));
          - pattern: |
              $PW = $_GET[$KEY];
              ...
              wp_update_user(array(..., 'user_pass' => $PW, ...));
          - pattern: |
              $PW = $_REQUEST[$KEY];
              ...
              wp_update_user(array(..., 'user_pass' => $PW, ...));
          - pattern: |
              $PW = $REQUEST->get_param(...);
              ...
              wp_update_user(array(..., 'user_pass' => $PW, ...));
          - pattern: |
              $PW = $REQUEST->get_params(...);
              ...
              wp_update_user(array(..., 'user_pass' => $PW, ...));
          - pattern: |
              $PW = $REQUEST->get_json_params(...);
              ...
              wp_update_user(array(..., 'user_pass' => $PW, ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $_POST[$KEY], ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $_GET[$KEY], ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $_REQUEST[$KEY], ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $REQUEST->get_param(...), ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $REQUEST->get_params(...), ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $REQUEST->get_json_params(...), ...));
          - pattern: |
              wp_update_user(array(..., 'user_pass' => $REQUEST->get_body_params(...), ...));
          - pattern: |
              $PW = $_POST[$KEY];
              ...
              wp_update_user([..., 'user_pass' => $PW, ...]);
          - pattern: |
              $PW = $_REQUEST[$KEY];
              ...
              wp_update_user([..., 'user_pass' => $PW, ...]);
          - pattern: |
              $PW = $REQUEST->get_json_params(...);
              ...
              wp_update_user([..., 'user_pass' => $PW, ...]);
          - pattern: |
              wp_update_user([..., 'user_pass' => $_POST[$KEY], ...]);
          - pattern: |
              wp_update_user([..., 'user_pass' => $_REQUEST[$KEY], ...]);
      # --- verification guards ------------------------------------------------
      # "if (<... guard ...>) { ... }" covers both the positive and the negated
      # condition; the bare-call forms cover the common
      # "if (!guard()) return; ..." and "check_admin_referer(...);" prologues.
      - pattern-not-inside: |
          if (<... wp_check_password(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          wp_check_password(...);
          ...
      - pattern-not-inside: |
          $RES = wp_check_password(...);
          ...
      - pattern-not-inside: |
          if (<... check_password_reset_key(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          check_password_reset_key(...);
          ...
      - pattern-not-inside: |
          $RES = check_password_reset_key(...);
          ...
      - pattern-not-inside: |
          if (<... wp_verify_nonce(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          wp_verify_nonce(...);
          ...
      - pattern-not-inside: |
          $RES = wp_verify_nonce(...);
          ...
      - pattern-not-inside: |
          if (<... check_admin_referer(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          check_admin_referer(...);
          ...
      - pattern-not-inside: |
          if (<... check_ajax_referer(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          check_ajax_referer(...);
          ...
      - pattern-not-inside: |
          if (<... current_user_can(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          current_user_can(...);
          ...
      - pattern-not-inside: |
          if (<... is_super_admin(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          is_super_admin(...);
          ...
    metadata:
      category: security
      cwe: "CWE-620: Unverified Password Change"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/620.html
        - https://developer.wordpress.org/reference/functions/wp_check_password/
        - https://developer.wordpress.org/reference/functions/check_password_reset_key/
        - https://developer.wordpress.org/reference/functions/wp_set_password/
        - https://developer.wordpress.org/reference/functions/wp_update_user/
      source: CodeVigilant
