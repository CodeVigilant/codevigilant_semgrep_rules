rules:
  # ============================================================================
  # AUTHENTICATION / ACCESS-GATE BYPASS VIA EMPTY SECRET (CWE-287)
  # Generic CodeVigilant rule.
  # ============================================================================
  #
  # Flags strict equality (===) comparisons between a stored secret-like
  # expression (option value, setting getter, variable, DB value) and a raw
  # request superglobal value ($_GET/$_POST/$_REQUEST/$_COOKIE).
  #
  # If the stored secret is empty or uninitialized (option never seeded,
  # setting cleared, empty string default), the comparison succeeds for an
  # EMPTY request value: `?key=` / `key=` / cookie "" — because
  # `'' === ''` is true in PHP. When such a comparison gates access
  # (maintenance-mode bypass links, preview codes, CSRF tokens, download
  # keys), unauthenticated attackers can bypass the gate entirely.
  #
  # Exclusions: comparisons where the secret is guarded by a non-empty
  # validation (!empty($secret), $secret !== '') before the comparison, or
  # where a constant-time comparison function (hash_equals) is used.
  #
  # If such a comparison appears in a request-facing callback without the
  # guard, any visitor can trigger the bypass. This is CWE-287 (Improper
  # Authentication).

  - id: codevigilant.php.wordpress.auth.bypass.empty_secret_strict_compare
    message: >-
      Strict equality comparison between a stored secret/credential expression
      and a raw request superglobal value. If the stored secret is empty or
      uninitialized, an empty request value (e.g. `?key=`) satisfies the
      comparison and can bypass the access check. Validate that the secret is
      non-empty before comparing, and use hash_equals() for secret comparison.
    severity: HIGH
    languages: [php]
    mode: search
    patterns:
      - pattern-either:
          - pattern: $SECRET === $_GET[$KEY]
          - pattern: $SECRET === $_POST[$KEY]
          - pattern: $SECRET === $_REQUEST[$KEY]
          - pattern: $SECRET === $_COOKIE[$KEY]
          - pattern: $_GET[$KEY] === $SECRET
          - pattern: $_POST[$KEY] === $SECRET
          - pattern: $_REQUEST[$KEY] === $SECRET
          - pattern: $_COOKIE[$KEY] === $SECRET
      # Exclude literal-vs-input comparisons (no stored secret involved).
      - metavariable-regex:
          metavariable: $SECRET
          regex: "^[^'\"0-9]"
      # Guard: non-empty validation of the secret before/around the comparison.
      - pattern-not-inside: |
          if ( ! empty( $SECRET ) ) { ... }
      - pattern-not-inside: |
          if ( empty( $SECRET ) ) { ... }
      - pattern-not-inside: |
          if ( <... ! empty( $SECRET ) ...> ) { ... }
      - pattern-not-inside: |
          if ( <... $SECRET !== '' ...> ) { ... }
      - pattern-not-inside: |
          if ( <... $SECRET !== "" ...> ) { ... }
      - pattern-not-inside: |
          if ( ! empty( $SECRET ) ) { ... } else { ... }
    metadata:
      category: security
      cwe: "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://developer.wordpress.org/apis/security/data-validation/
        - https://developer.wordpress.org/reference/functions/wp_verify_nonce/
        - https://www.php.net/manual/en/function.hash-equals.php
      source: Generic (CodeVigilant)
      license: MIT
