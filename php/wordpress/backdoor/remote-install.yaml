rules:
  - id: codevigilant.php.wordpress.backdoor.remote_plugin_archive_install
    patterns:
      - pattern-either:
          - pattern: unzip_file(<... $SRC ...>, $DEST)
          - pattern: copy(<... $SRC ...>, $DEST)
          - pattern: rename(<... $SRC ...>, $DEST)
      - metavariable-regex:
          metavariable: $DEST
          regex: (?i).*(WP_PLUGIN_DIR|WPMU_PLUGIN_DIR|plugin_dir_path\s*\().*
      - pattern-either:
          - pattern-inside: |
              function $F(...) {
                ...
                wp_remote_get(...);
                ...
              }
          - pattern-inside: |
              function $F(...) {
                ...
                wp_safe_remote_get(...);
                ...
              }
          - pattern-inside: |
              function $F(...) {
                ...
                download_url(...);
                ...
              }
          - pattern-inside: |
              function $F(...) {
                ...
                wp_remote_post(...);
                ...
              }
      - pattern-not-inside: |
          function $F(...) {
            ...
            current_user_can(...);
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            check_ajax_referer(...);
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            check_admin_referer(...);
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            wp_verify_nonce(...);
            ...
          }
    message: |
      Remote-supplied code is installed into the WordPress plugin directory without an
      integrity check. A payload fetched over the network is unzipped or copied straight
      into WP_PLUGIN_DIR / WPMU_PLUGIN_DIR / the current plugin directory, so whoever
      controls that response controls executable code on the site.

      This is the shape of a hidden update mechanism / backdoor: it runs without a
      capability or nonce check and installs whatever the remote host returns. Update
      only from a signed, allow-listed source (downloads.wordpress.org), verify the
      response hash or signature, and require current_user_can('install_plugins') plus
      a nonce before writing code into the plugins directory.
    metadata:
      category: security
      cwe: "CWE-494: Download of Code Without Integrity Check"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://developer.wordpress.org/reference/functions/unzip_file/
        - https://developer.wordpress.org/plugins/wordpress-org/how-to-submit-upload/
    languages: [php]
    mode: search
    severity: CRITICAL

  - id: codevigilant.php.wordpress.backdoor.remote_response_code_execution
    patterns:
      - pattern-either:
          - pattern: eval(<... wp_remote_retrieve_body($RESP) ...>)
          - pattern: assert(<... wp_remote_retrieve_body($RESP) ...>)
          - pattern: |
              $CODE = wp_remote_retrieve_body($RESP);
              ...
              eval($CODE);
          - pattern: |
              $CODE = wp_remote_retrieve_body($RESP);
              ...
              assert($CODE);
          - pattern: eval(<... $RESP['body'] ...>)
      - pattern-either:
          - pattern-inside: |
              $RESP = wp_remote_get(...);
              ...
          - pattern-inside: |
              $RESP = wp_safe_remote_get(...);
              ...
          - pattern-inside: |
              $RESP = wp_remote_post(...);
              ...
          - pattern-inside: |
              $RESP = wp_remote_request(...);
              ...
    message: |
      The body of a remote HTTP response is executed as PHP. Nothing verifies the
      integrity or provenance of that payload, so whoever controls the remote host — or
      anyone able to intercept or spoof the response — gets arbitrary code execution on
      every request. This is the dropped-backdoor shape.

      Never eval remote responses. Ship code through the WordPress.org update pipeline
      or a signed release artefact, and verify a pinned hash or signature before use.
    metadata:
      category: security
      cwe: "CWE-494: Download of Code Without Integrity Check"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      technology: wordpress
      confidence: HIGH
      references:
        - https://developer.wordpress.org/reference/functions/wp_remote_retrieve_body/
    languages: [php]
    mode: search
    severity: CRITICAL
