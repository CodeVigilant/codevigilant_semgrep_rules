rules:
  # ============================================================================
  # CLEARTEXT OUTBOUND REQUESTS (HTTP://)
  # Original CodeVigilant rule.
  # ============================================================================
  #
  # Flags outbound HTTP requests made over plaintext http:// URLs. API keys,
  # tokens, credentials and user data transmitted this way can be sniffed or
  # modified by any on-path attacker (shared hosting, ISP, Wi-Fi, malicious
  # proxy). Applies to wp_remote_get/wp_remote_post/wp_remote_request and the
  # wp_safe_remote_* equivalents. Loopback/localhost URLs are excluded.

  - id: codevigilant.php.wordpress.security.transport.cleartext_outbound
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: wp_remote_get($URL)
                  - pattern: wp_remote_post($URL)
                  - pattern: wp_remote_request($URL)
                  - pattern: wp_safe_remote_get($URL)
                  - pattern: wp_safe_remote_post($URL)
                  - pattern: wp_safe_remote_request($URL)
              - metavariable-regex:
                  metavariable: $URL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
          - patterns:
              - pattern: $U = $VAL;
              - pattern-inside: |
                  $U = $VAL;
                  ...
                  wp_remote_get($U, ...);
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
          - patterns:
              - pattern: $U = $VAL;
              - pattern-inside: |
                  $U = $VAL;
                  ...
                  wp_remote_post($U, ...);
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
          - patterns:
              - pattern: $U = $VAL;
              - pattern-inside: |
                  $U = $VAL;
                  ...
                  wp_remote_request($U, ...);
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
          - patterns:
              - pattern: $U = $VAL;
              - pattern-inside: |
                  $U = $VAL;
                  ...
                  wp_safe_remote_get($U, ...);
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
          - patterns:
              - pattern: $U = $VAL;
              - pattern-inside: |
                  $U = $VAL;
                  ...
                  wp_safe_remote_post($U, ...);
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
          - patterns:
              - pattern: $U = $VAL;
              - pattern-inside: |
                  $U = $VAL;
                  ...
                  wp_safe_remote_request($U, ...);
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"]http://(?!(localhost|127\\.0\\.0\\.1|\\[::1\\]|0\\.0\\.0\\.0))"
    message: |
      Detected an outbound HTTP request to a cleartext http:// URL. API keys,
      tokens, credentials and user data sent this way can be sniffed or
      tampered with by any on-path attacker. Use https:// URLs exclusively.
    metadata:
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: wordpress
      confidence: HIGH
      references:
        - https://developer.wordpress.org/plugins/http-api/
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    languages: [php]
    mode: search
    severity: HIGH
