rules:
  # ============================================================================
  # COOKIE DOMAIN DERIVED FROM $_SERVER['SERVER_NAME']
  # The Domain attribute of a sensitive cookie (auth token, 2FA nonce, session)
  # is derived from $_SERVER['SERVER_NAME']. On servers that reflect the Host
  # header into SERVER_NAME (reverse proxies, non-canonical vhosts) an attacker
  # can force the cookie to be scoped to an attacker-controlled domain, causing
  # the browser to disclose the cookie value to the attacker.
  # ============================================================================
  - id: codevigilant.php.wordpress.cookies.server_name.cookie_domain.taint
    message: "setcookie() domain attribute is derived from $_SERVER['SERVER_NAME'], which can reflect the attacker-controlled Host header. Sensitive cookies (session/2FA tokens) can be scoped to an attacker-controlled domain and leaked. Derive the domain from a validated site URL (parse_url(home_url())) or a fixed COOKIE_DOMAIN constant."
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_SERVER['SERVER_NAME']
    pattern-sinks:
      - pattern: setcookie(...)
    metadata:
      category: security
      cwe: "CWE-16: Configuration"
      owasp: "A05:2021 - Security Misconfiguration"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://owasp.org/www-project-web-security-testing-guide/stable/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/01-Test_for_Network_Infrastructure_Configuration
        - https://developer.wordpress.org/reference/functions/setcookie/
      source: bug-hunting code review (generic code shape)
      license: MIT
