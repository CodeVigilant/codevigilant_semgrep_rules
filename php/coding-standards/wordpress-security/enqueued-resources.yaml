rules:
  # ============================================================================
  # ENQUEUED RESOURCES RULES
  # Source: WordPress-Coding-Standards/WordPress/Sniffs/WP/EnqueuedResourcesSniff.php
  #         WordPress-Coding-Standards/WordPress/Sniffs/WP/EnqueuedResourceParametersSniff.php
  # License: MIT - Copyright (c) 2009 John Godley and contributors
  # ============================================================================

  - id: codevigilant.php.coding-standards.xss.inline_script_tag
    message: "Use wp_enqueue_script() instead of inline <script> tags for proper dependency management and XSS prevention."
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern-regex: echo\s*"<script
          - pattern-regex: echo\s*'<script
          - pattern-regex: print\s*"<script
    metadata:
      category: security
      cwe: "CWE-79"
      owasp: "A03:2021 - Injection"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://developer.wordpress.org/reference/functions/wp_enqueue_script/
        - https://github.com/WordPress/WordPress-Coding-Standards/blob/develop/WordPress/Sniffs/WP/EnqueuedResourcesSniff.php
      source: WordPress-Coding-Standards
      license: MIT

  - id: codevigilant.php.coding-standards.xss.inline_style_tag
    message: "Use wp_enqueue_style() instead of inline <link> or <style> tags for proper dependency management."
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern-regex: echo\s*"<link
          - pattern-regex: echo\s*'<link
          - pattern-regex: print\s*"<link
    metadata:
      category: security
      cwe: "CWE-79"
      owasp: "A03:2021 - Injection"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://developer.wordpress.org/reference/functions/wp_enqueue_style/
      source: WordPress-Coding-Standards
      license: MIT

  - id: codevigilant.php.coding-standards.xss.user_controlled_version_param
    message: "User-controlled input detected in wp_enqueue_script() or wp_enqueue_style() arguments. This could allow injection attacks if unsanitized input reaches the handle, src, or version parameters. Use hardcoded values or plugin version constants."
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: |
              wp_enqueue_script(..., $_GET[...], ...)
          - pattern: |
              wp_enqueue_script(..., $_POST[...], ...)
          - pattern: |
              wp_enqueue_script(..., $_REQUEST[...], ...)
          - pattern: |
              wp_enqueue_style(..., $_GET[...], ...)
          - pattern: |
              wp_enqueue_style(..., $_POST[...], ...)
          - pattern: |
              wp_enqueue_style(..., $_REQUEST[...], ...)
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code"
      owasp: "A03:2021 - Injection"
      technology: wordpress
      confidence: HIGH
      references:
        - https://developer.wordpress.org/reference/functions/wp_enqueue_script/
        - https://github.com/WordPress/WordPress-Coding-Standards/blob/develop/WordPress/Sniffs/WP/EnqueuedResourceParametersSniff.php
      source: WordPress-Coding-Standards
      license: MIT
