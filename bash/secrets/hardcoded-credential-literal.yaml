rules:
  - id: codevigilant.bash.secrets.hardcoded-credential-literal
    mode: search
    patterns:
      - pattern-either:
          - pattern: $VAR="$VAL"
          - pattern: $VAR=$VAL
          - pattern: export $VAR="$VAL"
          - pattern: export $VAR=$VAL
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|password|passwd|apikey|api[_-]?key|access[_-]?key|client[_-]?secret|auth|credential).*
      - metavariable-regex:
          metavariable: $VAL
          regex: ^[A-Za-z0-9+/_.=-]{16,}$
      - pattern-not: $VAR=${$VAL}     # environment indirection, not a literal
      - pattern-not: $VAR="$EMPTY"    # placeholder
    message: |
      A shell variable whose name indicates a credential (TOKEN/SECRET/PASSWORD/API key)
      is assigned a hardcoded literal value. If this script is committed to source
      control, the literal (which may be a live API token, admin password, or signing
      key) is exposed to anyone who can read the repository, and may also be present in
      build logs, container images, and CI artifacts. Rotate the exposed value, load it
      from a secret store, an environment variable set out-of-band, or an agent-provided
      credential instead of hardcoding it (CWE-798 / CWE-256).
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: shell
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://cwe.mitre.org/data/definitions/256.html
      source: independent security review
      license: MIT
    languages: [bash]
    severity: HIGH